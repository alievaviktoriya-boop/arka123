<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой сайт</title>
  <meta name="description" content="Описание сайта для поисковиков и превью ссылок.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="./">Мой сайт</a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="#about">О проекте</a>
        <a href="#contact">Контакты</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="container">
        <h1>Заголовок первого экрана</h1>
        <p class="lead">Короткий подзаголовок, который объясняет, о чём сайт.</p>
        <a class="button" href="#contact">Связаться</a>
      </div>
    </section>

    <section id="about" class="section">
      <div class="container">
        <h2>О проекте</h2>
        <p>Здесь будет основной контент.</p>
      </div>
    </section>

    <section id="contact" class="section section--alt">
      <div class="container">
        <h2>Контакты</h2>
        <p>Как с вами связаться.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span data-year></span> Мой сайт</p>
    </div>
  </footer>
</body>
</html>
